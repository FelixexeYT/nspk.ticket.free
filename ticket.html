<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уведомление об оплате</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="ticket-body">
    <div class="ticket-page" id="ticketToDownload">
        <h1 class="header-title">Уведомление об оплате</h1>
        
        <p class="success-text">Ваш проезд успешно оплачен!</p>

        <div class="payment-info">
            <div class="payment-info__vehicle-type">
                <span id="displayType"></span>: №<span id="displayRoute"></span>
            </div>
            <div class="payment-info__price">
                <span id="displayPrice"></span><span class="currency">₽</span>
            </div>
            <div class="payment-info__date" id="displayDate"></div>
            <div class="payment-info__vehicle-number">Т/С: <span id="displayVehicle"></span></div>
        </div>

        <div class="payment-timer">
            <p class="payment-timer__label">С момента оплаты прошло:</p>
            <div class="payment-timer__value" id="timerDisplay">00:00:00</div>
        </div>

        <div class="ticket__qrcode">
            <img id="qrCode" src="" alt="QR-код билета">
        </div>

        <div class="ticket__info">
            Предъявите контролеру QR-код.<br>
            Чтобы сохранить реквизиты билета, нажмите кнопку «Скачать»
        </div>

        <button class="ticket__button" id="downloadBtn">Скачать билет</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const savedData = localStorage.getItem('userTicket');

            if (!savedData) {
                document.body.innerHTML = '<div style="text-align:center; padding:50px; font-family:sans-serif;"><h2>Данные билета не найдены</h2><p>Пожалуйста, вернитесь на <a href="index.html">главную страницу</a> и заполните форму.</p></div>';
                return;
            }

            const data = JSON.parse(savedData);

            document.getElementById('displayType').textContent = data.type;
            document.getElementById('displayRoute').textContent = data.route;
            document.getElementById('displayVehicle').textContent = data.vehicle;
            document.getElementById('displayPrice').textContent = data.price;
            document.getElementById('displayDate').textContent = data.date;

            // QR-код (минимум 41x41 модулей = картинка 410x410)
            const typeEng = data.type === 'Автобус' ? 'bus' : 'trolleybus';
            const qrText = 'Транспорт: ' + typeEng + ', Маршрут: ' + data.route + ', ТС: ' + data.vehicle + ', Время входа: ' + data.date + ', Стоимость: ' + data.price + '₽';
            document.getElementById('qrCode').src = 'https://api.qrserver.com/v1/create-qr-code/?size=410x410&margin=0&data=' + encodeURIComponent(qrText);

            // Таймер вверх от 0
            let timeElapsed = 0;
            const timerDisplay = document.getElementById('timerDisplay');

            function updateTimer() {
                const hours = Math.floor(timeElapsed / 3600);
                const minutes = Math.floor((timeElapsed % 3600) / 60);
                const seconds = timeElapsed % 60;

                timerDisplay.textContent = 
                    String(hours).padStart(2, '0') + ':' + 
                    String(minutes).padStart(2, '0') + ':' + 
                    String(seconds).padStart(2, '0');

                timeElapsed++;
            }

            updateTimer();
            setInterval(updateTimer, 1000);

            // Скачивание билета
            document.getElementById('downloadBtn').addEventListener('click', function() {
                html2canvas(document.getElementById('ticketToDownload'), {
                    scale: 2,
                    backgroundColor: '#ffffff'
                }).then(function(canvas) {
                    const link = document.createElement('a');
                    link.download = 'ticket.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                });
            });
        });
    </script>
</body>
</html>
